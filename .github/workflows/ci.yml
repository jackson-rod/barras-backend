name: CI

on:
  pull_request:
    # `edited` too: a new title or description is checked again.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop, main]

# One run per ref. On a pull request, a newer run cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # On develop and main, a run in progress is not cancelled by a newer one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  # A pull request only reads the cache. Its runs read their own scope before
  # develop's, so a commit that wrote there could poison the results of the
  # pull request's next run; pushes to develop and main still write. The token
  # the cache needs stays in the environment of every later step, so a hostile
  # build script could still write to the pull request's own scope: the run on
  # develop after the merge is the authoritative result.
  SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
  RUSTC_WRAPPER: sccache

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: check-commits needs the commits of the branch and the base ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Toolchain comes from rust-toolchain.toml. The action's own cargo cache is
      # off because sccache is the cache here.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          # Its default sets CARGO_BUILD_WARNINGS=deny for every cargo command of the job. Locally only `just lint` denies cargo warnings, through its own flag; CI must compile exactly like `just verify`.
          build-warnings: ""
      # A fixed sccache release rather than whichever is newest; the action checks
      # the binary against the checksum file of that release.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      # Every tool and version here is in the action's manifest, with its checksum.
      # `fallback: none` makes one that is not fail the step instead of being
      # fetched by cargo-binstall, with no checksum pinned.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0,cargo-deny@0.20.2
          fallback: none
      # The pinned install-action has no manifest for cargo-hakari, so it would fall back to
      # cargo-binstall and download a prebuilt binary from the project's GitHub releases, with
      # no signature to check: the crate's binstall metadata declares none. Built instead from
      # its crates.io source at this version, with the lock file it was released with.
      - name: Install cargo-hakari
        run: cargo install --locked cargo-hakari@0.9.39
      # For `just db-check`. The pinned install-action has no manifest for sqlx-cli
      # either, so it is built the same way, with the command of `just setup`: the
      # version it pins, Postgres support alone, and the `sqlx-toml` feature, without
      # which sqlx-cli refuses to run beside the repository's sqlx.toml.
      - name: Install sqlx-cli
        run: cargo install --locked sqlx-cli@0.9.0 --no-default-features --features postgres,sqlx-toml
      # Docker Hub limits the pulls of an anonymous address, and a runner shares its
      # address. So the runner's Docker pulls every Docker Hub image through
      # mirror.gcr.io, Google's cache of Docker Hub, which sets no such limit: dockerd
      # reads `registry-mirrors` from /etc/docker/daemon.json when it starts, and falls
      # back to Docker Hub itself whenever the mirror fails or lacks the image. The
      # settings the runner's image already keeps in that file stay. Done before any
      # pull, so that every pull of the job goes through the mirror.
      - name: Pull Docker Hub images through mirror.gcr.io
        env:
          MIRROR: https://mirror.gcr.io
        run: |
          daemon=/etc/docker/daemon.json
          settings='{}'
          if [ -s "$daemon" ]; then settings="$(sudo cat "$daemon")"; fi
          jq --arg mirror "$MIRROR" '."registry-mirrors" = [$mirror]' <<< "$settings" > "$RUNNER_TEMP/daemon.json"
          sudo install --mode=0644 "$RUNNER_TEMP/daemon.json" "$daemon"
          sudo systemctl restart docker
          docker info --format 'registry mirrors: {{json .RegistryConfig.Mirrors}}'
      # The image of compose.yaml's postgres service, read from that file alone, as the
      # throwaway database of `just db-check` reads it. In a step of its own, with its
      # own bound, so that a slow pull is charged to no check.
      - name: Pull the Postgres image
        timeout-minutes: 5
        run: |
          image="$(docker compose --file compose.yaml config --images postgres)"
          docker pull "$image"
      # Every check runs even when a step above it failed, so one finding never
      # hides another.
      #
      # A branch name is chosen by whoever opens the pull request, so it reaches
      # the shell only through env, never through an expression inside run.
      - name: Check the branch name
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: cargo xtask check-branch "$BRANCH_NAME"
      - name: Check the commit messages
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cargo xtask check-commits "origin/$BASE_REF..HEAD"
      # From here to the pull request text, nothing compiles a member, so no build
      # script of the change runs before these have read the workspace: cargo xtask
      # builds only xtask, and cargo metadata, which cargo deny and cargo hakari
      # read, and cargo tree run no build script.
      - name: Architecture and structure
        if: ${{ !cancelled() }}
        run: just check-arch check-structure
      # Its own step, so that a failure above never hides it: it reads Cargo.lock
      # with --locked before cargo hakari's plain cargo metadata could rewrite a
      # stale one, and it compares the release build against a copy of the
      # workspace in a temporary folder. It only reads: a command that rewrote the
      # workspace-hack would fail the tree check below.
      - name: The workspace-hack
        if: ${{ !cancelled() }}
        run: just hakari-check
      - name: Format
        if: ${{ !cancelled() }}
        run: just fmt-check
      - name: Advisories, licences, bans and sources
        if: ${{ !cancelled() }}
        run: just deny
      # A squash merge makes the title the subject of the commit on develop and may
      # take the description as its body. Both are written by whoever opens the pull
      # request, so they reach the shell only through env.
      - name: Check the pull request title and description
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pull-request.txt"
          cargo xtask check-pr "$RUNNER_TEMP/pull-request.txt"
      # The steps that compile the members, and so run their build scripts, come last.
      - name: Lint
        if: ${{ !cancelled() }}
        run: just lint
      # It builds and starts barras-api; the bound stops a hung build or binary from
      # holding the job until the job's own limit.
      - name: OpenAPI document
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: just openapi-check
      # A throwaway Postgres from the image pulled above takes every migration from
      # empty; then `cargo sqlx prepare --check` and a comparison of the file names
      # fail when .sqlx/ is not what the queries and the migrations produce. It compiles
      # the workspace again, so the bound stops a hung build or container from holding
      # the job until the job's own limit.
      - name: Offline query metadata
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: just db-check
      # Catches a step that, by mistake, rewrites a tracked file or writes any file
      # outside target/, ignored ones included, such as .env or lcov.info. It does not
      # stop a hostile build script, which can undo its writes before this step runs.
      - name: Check that the tree is unchanged
        if: ${{ !cancelled() }}
        run: |
          changes="$(git status --porcelain --untracked-files=all --ignored -- . ':!target')"
          if [ -n "$changes" ]; then
            printf 'The steps above changed the tree:\n%s\n' "$changes"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # llvm-tools, which cargo-llvm-cov needs, is a component in rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          # Its default sets CARGO_BUILD_WARNINGS=deny for every cargo command of the job. Locally only `just lint` denies cargo warnings, through its own flag; CI must compile exactly like `just verify`.
          build-warnings: ""
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0,cargo-nextest@0.9.152,cargo-llvm-cov@0.9.1
          fallback: none
      # Docker Hub limits the pulls of an anonymous address, and a runner shares its
      # address. So the runner's Docker pulls every Docker Hub image through
      # mirror.gcr.io, Google's cache of Docker Hub, which sets no such limit: dockerd
      # reads `registry-mirrors` from /etc/docker/daemon.json when it starts, and falls
      # back to Docker Hub itself whenever the mirror fails or lacks the image. The
      # settings the runner's image already keeps in that file stay. Done before any
      # pull, so that every pull of the job goes through the mirror.
      - name: Pull Docker Hub images through mirror.gcr.io
        env:
          MIRROR: https://mirror.gcr.io
        run: |
          daemon=/etc/docker/daemon.json
          settings='{}'
          if [ -s "$daemon" ]; then settings="$(sudo cat "$daemon")"; fi
          jq --arg mirror "$MIRROR" '."registry-mirrors" = [$mirror]' <<< "$settings" > "$RUNNER_TEMP/daemon.json"
          sudo install --mode=0644 "$RUNNER_TEMP/daemon.json" "$daemon"
          sudo systemctl restart docker
          docker info --format 'registry mirrors: {{json .RegistryConfig.Mirrors}}'
      # The int_ and e2e_ tests start their containers from the image of compose.yaml's
      # postgres service, read from that file alone, as the testkit reads it. Pulled in
      # a step of its own, with its own bound, so that a slow pull is charged to no
      # test's time limit.
      - name: Pull the Postgres image
        timeout-minutes: 5
        run: |
          image="$(docker compose --file compose.yaml config --images postgres)"
          docker pull "$image"
      # Every test once under coverage, then the thresholds. nextest kills a test
      # that hangs (.config/nextest.toml).
      - name: Tests under coverage, and the thresholds
        run: just test-cov
      # Apart, because cargo-llvm-cov cannot measure doctests on stable. cargo test
      # has no limit of its own on a doctest that hangs, so the step has one.
      - name: Doctests
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: just test-doc
      # Catches a step that, by mistake, rewrites a tracked file or writes any file
      # outside target/, ignored ones included, such as .env or lcov.info. It does not
      # stop a hostile build script, which can undo its writes before this step runs.
      - name: Check that the tree is unchanged
        if: ${{ !cancelled() }}
        run: |
          changes="$(git status --porcelain --untracked-files=all --ignored -- . ':!target')"
          if [ -n "$changes" ]; then
            printf 'The steps above changed the tree:\n%s\n' "$changes"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          # Its default sets CARGO_BUILD_WARNINGS=deny for every cargo command of the job. Locally only `just lint` denies cargo warnings, through its own flag; CI must compile exactly like `just verify`.
          build-warnings: ""
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0
          fallback: none
      - run: just build
      # Catches a step that, by mistake, rewrites a tracked file or writes any file
      # outside target/, ignored ones included, such as .env or lcov.info. It does not
      # stop a hostile build script, which can undo its writes before this step runs.
      - name: Check that the tree is unchanged
        if: ${{ !cancelled() }}
        run: |
          changes="$(git status --porcelain --untracked-files=all --ignored -- . ':!target')"
          if [ -n "$changes" ]; then
            printf 'The steps above changed the tree:\n%s\n' "$changes"
            exit 1
          fi
