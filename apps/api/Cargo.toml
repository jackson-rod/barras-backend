[package]
name = "barras-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
barras-adapter-http.workspace = true
barras-bootstrap.workspace = true
# The error of the canonical OpenAPI JSON, which `RunError` keeps as its source.
serde_json.workspace = true
# The runtime the serve mode builds by hand.
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
# The test client; the feature is on only here, so it never reaches the binary.
barras-adapter-http = { workspace = true, features = ["testing"] }
barras-testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
