# Syntax of cargo-deny 0.19+ (licenses/bans/sources schema, version 2).
# https://embarkstudios.github.io/cargo-deny/

# Explicit so the policy does not change with the tool's defaults.
[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

# Our own crates are unpublished and carry no licence field.
[licenses.private]
ignore = true

# Hexagonal boundary: each outside-world crate may be a direct dependency
# of its adapter only. `wrappers` exempts direct dependents; every
# transitive path is still denied. When a third-party crate that wraps one
# of these arrives (for example `utoipa-axum`), add it to its row with a
# comment that says why.
[bans]
deny = [
    { crate = "sqlx", wrappers = ["barras-adapter-postgres", "barras-testkit"], reason = "database access lives in the postgres adapter" },
    { crate = "axum", wrappers = ["barras-adapter-http", "barras-adapter-realtime"], reason = "web framework lives in the HTTP and realtime adapters" },
    { crate = "reqwest", wrappers = ["barras-adapter-providers"], reason = "outbound HTTP lives in the providers adapter" },
    { crate = "redis", wrappers = ["barras-adapter-redis", "barras-testkit"], reason = "Redis access lives in the redis adapter" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
