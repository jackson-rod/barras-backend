[workspace]
resolver = "3"
members = [
  "apps/api", "apps/ingest",
  "crates/kernel",
  "crates/bootstrap",
  "crates/adapters/postgres", "crates/adapters/http", "crates/adapters/realtime",
  "crates/adapters/redis", "crates/adapters/providers",
  "crates/testkit", "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
cargo_metadata = "0.23.1"
proc-macro2 = { version = "1.0.107", default-features = false }
regex = "1.13.1"
rust_decimal = { version = "1.43.0", default-features = false }
serde_json = "1.0.154"
thiserror = "2.0.21"
tempfile = "3.27.0"
time = "0.3.55"
tokio = "1.54.1"
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
uuid = "1.29.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
disallowed_methods = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
