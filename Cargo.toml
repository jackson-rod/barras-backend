[workspace]
resolver = "3"
members = [
  "apps/api", "apps/ingest",
  "crates/kernel",
  "crates/bootstrap",
  "crates/adapters/postgres", "crates/adapters/http", "crates/adapters/realtime",
  "crates/adapters/redis", "crates/adapters/providers",
  "crates/testkit", "crates/workspace-hack", "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false }
barras-adapter-http = { path = "crates/adapters/http" }
barras-bootstrap = { path = "crates/bootstrap" }
barras-kernel = { path = "crates/kernel" }
barras-testkit = { path = "crates/testkit" }
cargo_metadata = "0.23.1"
form_urlencoded = { version = "1.2.2", default-features = false }
garde = { version = "0.23.0", default-features = false }
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper-util = { version = "0.1.21", default-features = false }
# Only for the `LevelFilter` of sqlx's statement logs, which sqlx does not re-export.
log = { version = "0.4.35", default-features = false }
proc-macro2 = { version = "1.0.107", default-features = false }
prometheus = { version = "0.14.0", default-features = false }
regex = "1.13.1"
rust_decimal = { version = "1.43.0", default-features = false }
serde = "1.0.229"
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
# Hand-written SQL checked at compile time against `.sqlx/` (ADR-0007), the pools and the
# embedded migrations; only what the postgres adapter uses.
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio"] }
syn = { version = "3.0.10", default-features = false }
thiserror = "2.0.21"
tempfile = "3.27.0"
# Pinned exactly, as the spikes of BAR-4 tried it (plan, appendix A.7). `watchdog` removes a
# test's containers when the test is stopped with SIGTERM or SIGINT. Without the default `ring`,
# no crypto provider is built: the tests reach Docker through its Unix socket, never over HTTPS.
testcontainers = { version = "=0.28.0", default-features = false, features = ["watchdog"] }
time = "0.3.55"
tokio = "1.54.1"
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.1", default-features = false }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
# The crate sqlx reads its URLs with, so that the rule of a database URL reads the URL itself.
url = "2.5.8"
utoipa = { version = "6.0.0", default-features = false }
utoipa-axum = "0.3.0"
uuid = "1.29.2"
workspace-hack = { version = "0.1", path = "crates/workspace-hack" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
disallowed_methods = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
