[package]
name = "barras-adapter-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
log.workspace = true
sqlx.workspace = true
# `migrate`, `seed` and `reset` log at `warn` a connection of theirs that does not close cleanly.
# barras-api's commands install no subscriber, so those warnings show only where one is
# installed, as in a test that installs its own.
tracing.workspace = true
url.workspace = true
workspace-hack.workspace = true

[features]
# `AppliedMigration::new`, for the tests of the crates that tell what a migration run applied.
testing = []

[dev-dependencies]
barras-testkit.workspace = true
# The statement logs, written as JSON lines and read back.
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tracing-subscriber = { workspace = true, features = ["fmt", "json"] }

[lints]
workspace = true
