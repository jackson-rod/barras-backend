[package]
name = "barras-adapter-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["matched-path"] }
barras-kernel.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["catch-panic", "compression-br", "compression-gzip", "request-id"] }
tracing.workspace = true
utoipa = { workspace = true, features = ["macros"] }
utoipa-axum.workspace = true
uuid = { workspace = true, features = ["v7"] }

[features]
# `TestClient` and its route guard, for the tests of the crates that build an app.
testing = []

[dev-dependencies]
http-body-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[lints]
workspace = true
