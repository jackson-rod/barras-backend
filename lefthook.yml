pre-commit:
  commands:
    fmt:
      run: just fmt-check
    lint:
      run: just lint
    arch:
      run: just check-arch
    structure:
      run: just check-structure
commit-msg:
  commands:
    message:
      run: cargo xtask check-commit-msg "{1}"
pre-push:
  commands:
    branch:
      run: cargo xtask check-branch
    verify:
      run: just verify
